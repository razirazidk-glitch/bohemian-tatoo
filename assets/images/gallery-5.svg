<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="darkBg2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#14141c" />
      <stop offset="100%" stop-color="#08080a" />
    </radialGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc1" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#darkBg2)" />

  <!-- Background celestial stars -->
  <g fill="#d4af37" opacity="0.4">
    <circle cx="100" cy="120" r="1.5" />
    <circle cx="150" cy="240" r="1.2" />
    <circle cx="480" cy="180" r="1.8" />
    <circle cx="520" cy="310" r="1.3" />
    <circle cx="120" cy="580" r="1.4" />
    <circle cx="470" cy="620" r="1.7" />
    <circle cx="210" cy="710" r="1.2" />
  </g>

  <!-- Central Vertical Axis -->
  <line x1="300" y1="80" x2="300" y2="660" stroke="url(#gold2)" stroke-width="1.2" opacity="0.6" stroke-dasharray="4 6" />

  <!-- Central Moon Phases Alignment -->
  <!-- Top New Moon / Dark Ring -->
  <circle cx="300" cy="140" r="18" fill="none" stroke="url(#gold2)" stroke-width="1.5" />
  
  <!-- Waxing Crescent -->
  <path d="M 300,205 A 24,24 0 0,0 300,253 A 20,20 0 0,1 300,205 Z" fill="url(#gold2)" />
  <circle cx="300" cy="229" r="24" fill="none" stroke="url(#gold2)" stroke-width="1" />

  <!-- Full Moon (Centerpiece with Sacred Sunburst) -->
  <g transform="translate(300, 370)">
    <!-- Sunburst Radiance -->
    <g stroke="url(#gold2)" stroke-width="1" opacity="0.7">
      <line x1="0" y1="-75" x2="0" y2="-90" />
      <line x1="0" y1="75" x2="0" y2="90" />
      <line x1="-75" y1="0" x2="-90" y2="0" />
      <line x1="75" y1="0" x2="90" y2="0" />
      <line x1="-53" y1="-53" x2="-64" y2="-64" />
      <line x1="53" y1="-53" x2="64" y2="-64" />
      <line x1="-53" y1="53" x2="-64" y2="64" />
      <line x1="53" y1="53" x2="64" y2="64" />
    </g>

    <!-- Outer Concentric Rings -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="url(#gold2)" stroke-width="1.8" />
    <circle cx="0" cy="0" r="56" fill="none" stroke="url(#gold2)" stroke-width="0.8" stroke-dasharray="2 4" />

    <!-- Full Moon Body -->
    <circle cx="0" cy="0" r="46" fill="#121218" stroke="url(#gold2)" stroke-width="1.5" />

    <!-- Sacred Third Eye in Moon -->
    <path d="M -30,0 Q 0,-22 30,0 Q 0,22 -30,0 Z" fill="none" stroke="url(#gold2)" stroke-width="2" />
    <circle cx="0" cy="0" r="10" fill="none" stroke="url(#gold2)" stroke-width="1.8" />
    <circle cx="0" cy="0" r="4.5" fill="url(#gold2)" />
  </g>

  <!-- Waning Crescent -->
  <path d="M 300,487 A 24,24 0 0,1 300,535 A 20,20 0 0,0 300,487 Z" fill="url(#gold2)" />
  <circle cx="300" cy="511" r="24" fill="none" stroke="url(#gold2)" stroke-width="1" />

  <!-- Bottom Dark Moon with Dagger tip -->
  <circle cx="300" cy="600" r="18" fill="none" stroke="url(#gold2)" stroke-width="1.5" />
  <polygon points="296,620 304,620 300,660" fill="url(#gold2)" />

  <!-- Botanical Vine framing -->
  <path d="M 230,370 Q 210,320 240,270 Q 220,230 250,190" fill="none" stroke="url(#gold2)" stroke-width="1.2" opacity="0.65" />
  <path d="M 370,370 Q 390,320 360,270 Q 380,230 350,190" fill="none" stroke="url(#gold2)" stroke-width="1.2" opacity="0.65" />

  <!-- Typography Caption -->
  <text x="300" y="720" fill="url(#gold2)" font-family="'Cinzel', serif" font-size="18" font-weight="600" letter-spacing="6" text-anchor="middle">
    LUNA &amp; CELESTIAL
  </text>
  <text x="300" y="745" fill="#a09e99" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" letter-spacing="3" text-anchor="middle">
    SINGLE-NEEDLE FINELINE &amp; ESOTERISME
  </text>
</svg>
