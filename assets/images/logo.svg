<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Bohemian Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3cd" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#e6ca65" />
    </linearGradient>
    
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#aa7c11" stop-opacity="0" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <path id="textCircleUpper" d="M 70,250 A 180,180 0 1,1 430,250" fill="none" />
    <path id="textCircleLower" d="M 430,250 A 180,180 0 0,1 70,250" fill="none" />
  </defs>

  <!-- Background decorative glow ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#goldGlow)" stroke-width="2" stroke-dasharray="4 8" />

  <!-- Outer Fine Ornate Ring -->
  <circle cx="250" cy="250" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 6" />

  <!-- Sunburst Rays / Sacred Geometry Points -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.85">
    <!-- 12 Cardinal Rays -->
    <line x1="250" y1="26" x2="250" y2="40" />
    <line x1="250" y1="460" x2="250" y2="474" />
    <line x1="26" y1="250" x2="40" y2="250" />
    <line x1="460" y1="250" x2="474" y2="250" />
    <line x1="92" y1="92" x2="102" y2="102" />
    <line x1="398" y1="92" x2="408" y2="82" />
    <line x1="92" y1="408" x2="102" y2="398" />
    <line x1="398" y1="408" x2="408" y2="418" />
  </g>

  <!-- Circular Arch Text: BOHEMIAN TATOO -->
  <text fill="url(#goldGrad)" font-family="'Cinzel', 'Playfair Display', serif" font-size="28" font-weight="700" letter-spacing="9" filter="url(#subtleGlow)">
    <textPath href="#textCircleUpper" startOffset="50%" text-anchor="middle">
      BOHEMIAN TATOO
    </textPath>
  </text>

  <!-- Circular Arch Text: CHRISTIANIA • COPENHAGEN -->
  <text fill="url(#goldGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="6" opacity="0.95">
    <textPath href="#textCircleLower" startOffset="50%" text-anchor="middle">
      ✦ CHRISTIANIA • KØBENHAVN ✦
    </textPath>
  </text>

  <!-- Inner Concentric Sacred Rings -->
  <circle cx="250" cy="250" r="145" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" />
  <circle cx="250" cy="250" r="139" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="3 4" />

  <!-- Sacred Geometry Octagram / Diamond Star -->
  <g stroke="url(#goldGrad)" stroke-width="1" fill="none" opacity="0.75">
    <polygon points="250,115 345,210 345,290 250,385 155,290 155,210" />
    <polygon points="210,155 290,155 385,250 290,345 210,345 115,250" />
  </g>

  <!-- Central Mystical Bohemian Crescent Moon -->
  <path d="M 230,175 A 75,75 0 1,0 280,315 A 88,88 0 0,1 230,175 Z" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Tattoo Machine Needle / Stylized Spear of Art -->
  <g id="tattoo-needle" filter="url(#subtleGlow)">
    <!-- Central Fine Needle Shaft -->
    <line x1="250" y1="130" x2="250" y2="370" stroke="url(#goldGrad)" stroke-width="2.2" />
    <!-- Needle Tip at bottom -->
    <polygon points="248,370 252,370 250,395" fill="url(#goldGrad)" />
    <!-- Ink Drop dropping from tip -->
    <circle cx="250" cy="405" r="2.5" fill="url(#goldGrad)" />
    <circle cx="250" cy="414" r="1.5" fill="url(#goldGrad)" opacity="0.7" />

    <!-- Ornate Hilt / Machine Grip Elements -->
    <circle cx="250" cy="250" r="16" fill="#0f0f11" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="250" cy="250" r="8" fill="url(#goldGrad)" />
    <circle cx="250" cy="250" r="3" fill="#0f0f11" />

    <!-- Crossguard & Winged flourish -->
    <path d="M 215,242 Q 235,248 250,235 Q 265,248 285,242" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
    <path d="M 220,258 Q 235,252 250,265 Q 265,252 280,258" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
  </g>

  <!-- Esoteric Eye / Starburst at Upper Center -->
  <g transform="translate(250, 160)">
    <circle cx="0" cy="0" r="3" fill="url(#goldGrad)" />
    <line x1="0" y1="-8" x2="0" y2="8" stroke="url(#goldGrad)" stroke-width="1.2" />
    <line x1="-8" y1="0" x2="8" y2="0" stroke="url(#goldGrad)" stroke-width="1.2" />
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="url(#goldGrad)" stroke-width="0.8" />
    <line x1="-5" y1="5" x2="5" y2="-5" stroke="url(#goldGrad)" stroke-width="0.8" />
  </g>

  <!-- Bohemian Botanical / Laurel Accents -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.8">
    <path d="M 160,250 C 160,220 175,200 195,190" />
    <circle cx="195" cy="190" r="2.5" fill="url(#goldGrad)" />
    <path d="M 340,250 C 340,220 325,200 305,190" />
    <circle cx="305" cy="190" r="2.5" fill="url(#goldGrad)" />
  </g>

  <!-- Est. Year small banner -->
  <g transform="translate(250, 340)">
    <rect x="-42" y="-10" width="84" height="20" rx="3" fill="#0f0f11" stroke="url(#goldGrad)" stroke-width="0.8" />
    <text x="0" y="4" fill="url(#goldGrad)" font-family="'Cinzel', serif" font-size="9" font-weight="600" letter-spacing="2" text-anchor="middle">
      EST. 2018
    </text>
  </g>
</svg>
